backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "posts"
    label: "Posts"

    files:
      - label: "Blog Posts"
        name: "blog"
        file: "posts/posts.json"

        fields:
          - label: "Posts"
            name: "posts"
            widget: "list"

            fields:
              - {label: "Title", name: "title", widget: "string"}

              - {label: "Image", name: "image", widget: "image"}

              - {label: "Description", name: "description", widget: "text"}